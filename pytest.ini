[tool:pytest]
# Pytest configuration file for cif2qewan

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = -v --tb=short --strict-markers --disable-warnings --color=yes --durations=10

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    functional: Functional tests
    slow: Slow running tests
    requires_qe: Tests requiring Quantum ESPRESSO
    requires_wannier90: Tests requiring Wannier90
    requires_cif2cell: Tests requiring cif2cell
    requires_api: Tests requiring external API access

# Minimum version
minversion = 6.0

# Test collection
collect_ignore = setup.py build dist

# Coverage options (if pytest-cov is installed)
# addopts = --cov=cif2qewan --cov-report=html --cov-report=term-missing
