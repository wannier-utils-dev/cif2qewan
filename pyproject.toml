[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cif2qewan"
version = "0.2.0"
description = "Generate Quantum ESPRESSO and Wannier90 input files from CIF files"
readme = "README.md"
license = "MIT"
authors = [
    {name = "The cif2qewan developers"},
]
keywords = [
    "quantum-espresso",
    "wannier90",
    "dft",
    "band-structure",
    "cif",
    "materials-science",
    "first-principles",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.19.0",
    "pandas>=1.3.0",
    "pymatgen>=2022.0.0",
    "toml>=0.10.0",
    "docopt>=0.6.0",
    "matplotlib>=3.3.0",
    "seekpath>=2.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=6.0",
]

[project.urls]
Homepage = "https://github.com/wannier-utils-dev/cif2qewan"
Repository = "https://github.com/wannier-utils-dev/cif2qewan.git"
Issues = "https://github.com/wannier-utils-dev/cif2qewan/issues"

[project.scripts]
cif2qewan = "cif2qewan.cif2qewan:main"
band_comp = "cif2qewan.band_comp:main"
wannier_conv = "cif2qewan.wannier_conv:main"

[tool.setuptools]
packages = ["cif2qewan"]

[tool.setuptools.package-data]
cif2qewan = ["*.csv"]
