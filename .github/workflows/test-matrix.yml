name: Test Matrix

on:
  push:
    branches: [ main, develop, setup-pip-install ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests every Monday at 9:00 UTC
    - cron: '0 9 * * 1'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
        exclude:
          # Exclude some combinations to reduce CI time
          - os: windows-latest
            python-version: '3.8'
          - os: macos-latest
            python-version: '3.8'
          - os: ubuntu-latest
            python-version: '3.12'

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
    
    - name: Install package in development mode
      run: |
        pip install -e .
    
    - name: Run fast tests
      run: |
        python run_tests.py --type fast
    
    - name: Run all tests
      run: |
        python run_tests.py
    
    - name: Test command-line tools
      run: |
        # Test that all command-line tools can be imported
        python -c "import cif2qewan; print('cif2qewan imported successfully')"
        python -c "import band_comp; print('band_comp imported successfully')"
        python -c "import wannier_conv; print('wannier_conv imported successfully')"
    
    - name: Test package metadata
      run: |
        python -c "import cif2qewan; print(f'Version: {cif2qewan.__version__}')"
        python -c "import cif2qewan; print(f'Author: {cif2qewan.__author__}')"
        python -c "import cif2qewan; print(f'License: {cif2qewan.__license__}')"
