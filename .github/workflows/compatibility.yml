name: Compatibility

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-12, macos-13, windows-2022]
        python-version: ['3.9', '3.10', '3.11', '3.12']
        exclude:
          # Exclude some combinations to reduce CI time
          - os: ubuntu-22.04
            python-version: '3.12'

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
        pip install -e .
    
    - name: Run compatibility tests
      run: |
        # Test basic functionality
        python -c "import cif2qewan; print('Import successful')"
        python -c "import band_comp; print('band_comp import successful')"
        python -c "import wannier_conv; print('wannier_conv import successful')"
        
        # Test configuration loading
        python -c "
        import toml
        config = toml.load('examples/PseudoDojo/Fe/input/cif2qewan.toml')
        print('Config loading successful')
        "
        
        # Run fast tests
        python run_tests.py --type fast
