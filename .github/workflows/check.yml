name: Check

on:
  push:
    branches: [ main, develop, setup-pip-install ]
  pull_request:
    branches: [ main, develop ]

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: 3.10
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
        pip install -e .
    
    - name: Check package installation
      run: |
        # Test package installation
        pip install -e . --force-reinstall
        
        # Test imports
        python -c "import cif2qewan; print('cif2qewan imported successfully')"
        python -c "import band_comp; print('band_comp imported successfully')"
        python -c "import wannier_conv; print('wannier_conv imported successfully')"
        
        # Test package metadata
        python -c "
        import cif2qewan
        print(f'Version: {cif2qewan.__version__}')
        print(f'Author: {cif2qewan.__author__}')
        print(f'License: {cif2qewan.__license__}')
        "
    
    - name: Check command-line tools
      run: |
        # Test command-line tools
        python -c "
        import cif2qewan
        if hasattr(cif2qewan, 'main'):
            print('✓ cif2qewan has main function')
        else:
            print('✗ cif2qewan missing main function')
        "
        
        python -c "
        import band_comp
        if hasattr(band_comp, 'main'):
            print('✓ band_comp has main function')
        else:
            print('✗ band_comp missing main function')
        "
        
        python -c "
        import wannier_conv
        if hasattr(wannier_conv, 'main'):
            print('✓ wannier_conv has main function')
        else:
            print('✗ wannier_conv missing main function')
        "
    
    - name: Check examples
      run: |
        # Check example files
        echo "Checking example files..."
        
        # Check PseudoDojo example
        if [ -d "examples/PseudoDojo/Fe" ]; then
          echo "✓ PseudoDojo Fe example directory exists"
          if [ -f "examples/PseudoDojo/Fe/input/mp-13_Fe.cif" ]; then
            echo "✓ PseudoDojo CIF file exists"
          fi
          if [ -f "examples/PseudoDojo/Fe/input/cif2qewan.toml" ]; then
            echo "✓ PseudoDojo config file exists"
          fi
        fi
        
        # Check PSLibrary example
        if [ -d "examples/PSLibrary/Fe" ]; then
          echo "✓ PSLibrary Fe example directory exists"
          if [ -f "examples/PSLibrary/Fe/input/mp-13_Fe.cif" ]; then
            echo "✓ PSLibrary CIF file exists"
          fi
          if [ -f "examples/PSLibrary/Fe/input/cif2qewan.toml" ]; then
            echo "✓ PSLibrary config file exists"
          fi
        fi
    
    - name: Check tests
      run: |
        # Check test files
        echo "Checking test files..."
        
        if [ -d "tests" ]; then
          echo "✓ tests directory exists"
          if [ -f "tests/test_cif2qewan.py" ]; then
            echo "✓ test_cif2qewan.py exists"
          fi
          if [ -f "tests/test_integration.py" ]; then
            echo "✓ test_integration.py exists"
          fi
          if [ -f "tests/test_functional.py" ]; then
            echo "✓ test_functional.py exists"
          fi
        fi
        
        # Run fast tests
        python run_tests.py --type fast
    
    - name: Check documentation
      run: |
        # Check documentation files
        echo "Checking documentation files..."
        
        if [ -f "README.md" ]; then
          echo "✓ README.md exists"
        fi
        
        if [ -f "LICENSE" ]; then
          echo "✓ LICENSE exists"
        fi
        
        if [ -f "CONTRIBUTING.md" ]; then
          echo "✓ CONTRIBUTING.md exists"
        fi
        
        if [ -f "CHANGELOG.md" ]; then
          echo "✓ CHANGELOG.md exists"
        fi
