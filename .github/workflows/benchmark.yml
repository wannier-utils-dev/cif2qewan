name: Benchmark

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run benchmarks every Sunday at 3:00 UTC
    - cron: '0 3 * * 0'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
        pip install -e .
        pip install pytest-benchmark
    
    - name: Run benchmarks
      run: |
        # Create a simple benchmark test
        python -c "
        import time
        import cif2qewan
        
        # Benchmark import time
        start = time.time()
        import cif2qewan
        import_time = time.time() - start
        print(f'Import time: {import_time:.4f} seconds')
        
        # Benchmark configuration loading
        start = time.time()
        import toml
        config = toml.load('examples/PseudoDojo/Fe/input/cif2qewan.toml')
        config_time = time.time() - start
        print(f'Config loading time: {config_time:.4f} seconds')
        "
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmark-results.json
