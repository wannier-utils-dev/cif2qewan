# cif2qewan configuration file
#
# Only pseudo_dir, scf_k_resolution, degauss and [pw2wan] are required; the
# other keys have defaults that work with an installed cif2qewan.

# Directory containing the pseudopotential files (written into the QE inputs)
pseudo_dir = "/path/to/pseudo_dir"

# Pseudopotential / Wannier projection table (CSV).
# Default: the PSLibrary table "pp_psl_rrkj.csv" installed with cif2qewan.
# A bare file name selects a bundled table: "pp_psl_rrkj.csv" (PSLibrary),
# "nc-sr-05_pbe_standard_upf.csv" or "nc-sr-05_pbe_stringent_upf.csv"
# (PseudoDojo). Anything with a directory part is used as a path.
# pp_list_path = "nc-sr-05_pbe_standard_upf.csv"

# The cif2cell executable used by the default structure reader.
# Default: "cif2cell" on PATH, which is where `pip install cif2cell` puts it.
# Not needed with `--reader pymatgen`.
# cif2cell_path = "/path/to/cif2cell"

# K-point resolution for the SCF mesh (in 1/Å); smaller values give denser meshes
scf_k_resolution = 0.15

# Gaussian smearing (in Ry)
degauss = 0.01

# Cell representation in the QE inputs. Default (false): ibrav = 0 with the
# lattice vectors in CELL_PARAMETERS. true: QE's Bravais lattice index ibrav
# with A, B, C, cosAB, ... (as in mcif2qewan and cif2x); the structure is
# re-expressed in QE's lattice vectors.
# use_ibrav = false

# pw2wannier90 options
[pw2wan]
# Write the UNK files needed to plot Wannier functions (true / false)
write_unk = ".true."
